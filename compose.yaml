# Application services run without capabilities, without privilege gain and with a read-only
# root (#318). Writable: the instance volume and /tmp (uploads, Gunicorn heartbeat). When used,
# mount SKELETON_FILES_ROOT (private attachments) and PROMETHEUS_MULTIPROC_DIR as volumes too.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
services:
  postgres:
    image: postgres:18.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skeleton}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define a private PostgreSQL administrator password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.8.3
    # The password comes from the container environment ($$ escapes Compose interpolation), so it is
    # not in the rendered command (#318); Redis replaces its process title, hiding the argument.
    # Through docker-entrypoint.sh, the server still drops from root to the redis user.
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define a private Redis password}
  web:
    <<: *hardened
    build: .
    image: ${SKELETON_IMAGE:-django-skeleton:local}
    ports: ["127.0.0.1:8000:8000"]
    # The setup exits the process when it completes; the policy brings it back in normal mode.
    restart: unless-stopped
    # Optional overrides of the instance configuration (the environment wins over the SQLite).
    env_file:
      - path: ${SKELETON_INSTANCE_ENV_FILE:-.env.instance}
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Bootstrap only: the configuration itself lives in the instance volume (#143, #146).
      SKELETON_INSTANCE_DB: /instance/instance.sqlite3
      SKELETON_INSTANCE_KEY_FILE: /instance/keys/master.key
      SKELETON_SETUP_RESTART: exit
      SKELETON_SETUP_ALLOWED_HOSTS: ${SKELETON_SETUP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SKELETON_SETUP_SECURE_COOKIES: ${SKELETON_SETUP_SECURE_COOKIES:-false}
      SKELETON_REQUIRE_ADMIN_MFA: "true"
      SKELETON_DEPLOYMENT_INVENTORY: ${SKELETON_DEPLOYMENT_INVENTORY:-}
      SKELETON_MAINTENANCE_MARKER: /run/skeleton/release/maintenance
      SKELETON_AGENT_SOCKET: ${SKELETON_AGENT_SOCKET:-}
      SKELETON_AGENT_TOKEN_FILE: ${SKELETON_AGENT_TOKEN_FILE:-}
    volumes:
      - instance:/instance
      - ${SKELETON_RELEASE_METADATA_DIR:-./deploy/runtime}:/run/skeleton/release:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      # Resolves a Host the instance accepts (setup or normal mode) without starting Django.
      test: ["CMD", "python", "-m", "skeleton.api.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
  # Job worker and periodic scheduler (#40): same image, instance volume and environment as web.
  # The deployment agent stops them before migrations and starts them after the cutover
  # (compose.worker_services). Until the setup finishes they exit and the policy retries.
  worker:
    <<: *hardened
    image: ${SKELETON_IMAGE:-django-skeleton:local}
    build: .
    command: ["python", "manage.py", "run_worker", "--queues", "default"]
    restart: unless-stopped
    stop_grace_period: 5m
    env_file:
      - path: ${SKELETON_INSTANCE_ENV_FILE:-.env.instance}
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SKELETON_INSTANCE_DB: /instance/instance.sqlite3
      SKELETON_INSTANCE_KEY_FILE: /instance/keys/master.key
      SKELETON_DEPLOYMENT_INVENTORY: ${SKELETON_DEPLOYMENT_INVENTORY:-}
      SKELETON_MAINTENANCE_MARKER: /run/skeleton/release/maintenance
    volumes:
      - instance:/instance
      - ${SKELETON_RELEASE_METADATA_DIR:-./deploy/runtime}:/run/skeleton/release:ro
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_jobs", "--max-lag", "900"]
      interval: 60s
      timeout: 20s
      retries: 3
  scheduler:
    <<: *hardened
    image: ${SKELETON_IMAGE:-django-skeleton:local}
    build: .
    command: ["python", "manage.py", "run_scheduler", "--interval", "30"]
    restart: unless-stopped
    env_file:
      - path: ${SKELETON_INSTANCE_ENV_FILE:-.env.instance}
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SKELETON_INSTANCE_DB: /instance/instance.sqlite3
      SKELETON_INSTANCE_KEY_FILE: /instance/keys/master.key
      SKELETON_DEPLOYMENT_INVENTORY: ${SKELETON_DEPLOYMENT_INVENTORY:-}
      SKELETON_MAINTENANCE_MARKER: /run/skeleton/release/maintenance
    volumes:
      - instance:/instance
      - ${SKELETON_RELEASE_METADATA_DIR:-./deploy/runtime}:/run/skeleton/release:ro
    depends_on:
      web: {condition: service_healthy}
  migrator:
    <<: *hardened
    image: ${SKELETON_IMAGE:-django-skeleton:local}
    build: .
    profiles: ["migration"]
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.migrate
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      SKELETON_DEPLOYMENT_INVENTORY: ${SKELETON_DEPLOYMENT_INVENTORY:-}
    volumes:
      - ${SKELETON_RELEASE_METADATA_DIR:-./deploy/runtime}:/run/skeleton/release:ro
    depends_on:
      postgres: {condition: service_healthy}
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    profiles: ["integrations"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: fixture-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define disposable Keycloak admin password}
      KC_HOSTNAME: http://127.0.0.1:8080
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./tests/sso:/opt/keycloak/data/import:ro"]
volumes:
  postgres_data:
  instance:
