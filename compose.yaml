# One application node of a Skeleton instance in high availability (#685); see
# docs/high-availability.md and docs/deployment.md. PostgreSQL and Redis are NOT here: they run on a
# data server (deploy/data-server/compose.yaml, one Compose project per instance). Every node of the
# instance runs this file, each as its own Compose project on its own host, behind a load balancer
# that checks /health/ready/.
#
# Like every deployment, the node runs the deployment agent (#649): a candidate (it holds the owner
# credential and can become the primary that migrates) or a follower (never the owner), in the cluster
# of agents of #678-#682. Web, worker and scheduler run the agent's active release through the launcher
# (#651) and wait for the agent (--wait-for-agent) before starting it, so a node that missed an update
# never serves old code against a migrated database. No service mounts the Docker socket.
#
# The instance configuration comes from the environment, the same on every node (cluster mode, #673):
# SKELETON_INSTANCE_ENV_FILE names a private file made by `manage.py instance export-env` (database,
# cache with SKELETON_CACHE_KEY_PREFIX, email, keys, files in S3 or a declared shared volume).
#
# Required: SKELETON_INSTANCE_ENV_FILE, SKELETON_NODE_ID, SKELETON_CLUSTER_URL (https://<this node's
# private address>:9443), SKELETON_CLUSTER_DIR (ca.crt, node.crt, node.key and the channel secret of
# `cluster keygen`), SKELETON_RUNTIME_DATABASE_URL; on a candidate SKELETON_MIGRATION_DATABASE_URL, on
# a follower (SKELETON_AGENT_ROLE=follower) SKELETON_COORDINATION_DATABASE_URL instead. Use
# sslmode=verify-full in the URLs to the data server. Optional: SKELETON_AGENT_ROLE (candidate),
# SKELETON_CLUSTER_PREFERRED, SKELETON_CLUSTER_BIND/PORT (where the channel is published),
# SKELETON_WEB_BIND/PORT, SKELETON_WEB_WORKERS/THREADS, SKELETON_FILES_SOURCE (a host path of the shared
# files volume), SKELETON_AGENT_STATE_SOURCE (a host path shared by the candidates), SKELETON_CORE_VERSION,
# SKELETON_AGENT_RELEASE_FILE and, for a fork, SKELETON_AGENT_SOURCE/PUBLISHER/PUBLISHER_KEY.
#
# Connections: nodes x (SKELETON_WEB_WORKERS x SKELETON_WEB_THREADS + worker + scheduler) + agent must
# fit PostgreSQL's max_connections, or put the PgBouncer of the data server in front of the runtime role.
#
# A single host with everything: run deploy/data-server/compose.yaml on it too, published on an address
# the containers reach (host.docker.internal resolves to the host here). compose.sandbox.yaml keeps its
# own PostgreSQL and Redis for evaluation.
#
# Application services run without capabilities, without privilege gain and with a read-only root
# (#318). Writable: the files and launcher state volumes and /tmp.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

# Everything on by default (#649); each switch can be turned off by its variable.
x-features: &features
  SKELETON_BUNDLED_APPS: ${SKELETON_BUNDLED_APPS-calendar,ledger}
  SKELETON_ENABLE_EXAMPLE_APP: ${SKELETON_ENABLE_EXAMPLE_APP:-true}
  SKELETON_BILLING_ENABLED: ${SKELETON_BILLING_ENABLED:-true}

x-app-environment: &app-environment
  <<: *features
  DJANGO_SETTINGS_MODULE: config.settings.production
  # The configuration is the environment, the same on every node (#673).
  SKELETON_INSTANCE_MODE: cluster
  SKELETON_FILES_ROOT: /files
  # The launcher's own code; the release it starts gets the release's paths instead.
  PYTHONPATH: /opt/launcher
  SKELETON_AGENT_SOCKET: /control/agent.sock
  SKELETON_AGENT_TOKEN_FILE: /control/agent.token
  SKELETON_MAINTENANCE_MARKER: /control/maintenance
  # The rolling update takes the node out of the balancer through the readiness (#682).
  SKELETON_DRAIN_MARKER: /control/drain
  SKELETON_NODE_ID: ${SKELETON_NODE_ID:?Define the name of this node}
  # The agent migrated the schema: the setup only confirms it, never asks for the owner (#652).
  SKELETON_SETUP_SCHEMA: agent

# What the application services mount: the releases and the agent's control files read-only. Files
# are shared by every node: a host path of a shared volume here, or S3 in the configuration (E048).
x-app-volumes: &app-volumes
  - ${SKELETON_FILES_SOURCE:-files}:/files
  - releases:/releases:ro
  - control:/control:ro
  - control_state:/control-state

x-instance-env-file: &instance-env-file
  - path: ${SKELETON_INSTANCE_ENV_FILE:?Define the configuration file of the instance (instance export-env)}
    required: true

services:
  # The deployment agent of this node (#652, #678): on a new cluster the first candidate to take the
  # primary's lock installs generation 0 from the signed release; the other nodes install the release
  # the cluster runs from the primary, over the channel between agents (#680).
  agent:
    <<: *hardened
    build:
      context: .
      target: agent
    image: ${SKELETON_AGENT_IMAGE:-django-skeleton-agent:local}
    restart: unless-stopped
    stop_grace_period: 30m
    env_file: *instance-env-file
    environment:
      <<: *features
      SKELETON_INSTANCE_MODE: cluster
      SKELETON_RUNTIME_DATABASE_URL: ${SKELETON_RUNTIME_DATABASE_URL:?Define the runtime URL of the data server}
      # The owner credential, only on a candidate node; a follower refuses it (follower_has_owner).
      SKELETON_MIGRATION_DATABASE_URL: ${SKELETON_MIGRATION_DATABASE_URL:-}
      # The role skeleton_agent, only on a follower node (#678).
      SKELETON_COORDINATION_DATABASE_URL: ${SKELETON_COORDINATION_DATABASE_URL:-}
      SKELETON_NODE_ID: ${SKELETON_NODE_ID:?Define the name of this node}
      SKELETON_AGENT_ROLE: ${SKELETON_AGENT_ROLE:-candidate}
      SKELETON_CLUSTER_PREFERRED: ${SKELETON_CLUSTER_PREFERRED:-false}
      SKELETON_CLUSTER_URL: ${SKELETON_CLUSTER_URL:?Define the private address of this node's channel}
      SKELETON_CLUSTER_DIR: /run/cluster
      SKELETON_PUBLIC_HOST: ${SKELETON_PUBLIC_HOST:-localhost}
      SKELETON_HEALTH_URL: http://web:8000
      SKELETON_CORE_VERSION: ${SKELETON_CORE_VERSION:-}
      SKELETON_AGENT_RELEASE_FILE: ${SKELETON_AGENT_RELEASE_FILE:-}
      SKELETON_AGENT_SOURCE: ${SKELETON_AGENT_SOURCE:-alaorneto/skeleton}
      SKELETON_AGENT_PUBLISHER: ${SKELETON_AGENT_PUBLISHER:-skeleton}
      SKELETON_AGENT_PUBLISHER_KEY: ${SKELETON_AGENT_PUBLISHER_KEY:-/opt/agent/publishers/skeleton.pub.pem}
    # The channel between agents (#680), on the private network of the nodes only.
    ports: ["${SKELETON_CLUSTER_BIND:-127.0.0.1}:${SKELETON_CLUSTER_PORT:-9443}:9443"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - agent_private:/agent/private
      # The agent's own code (#772): agent_root, where it updates itself. It holds the code of the
      # process with the owner credential: mount it in this service only, never in web, worker or scheduler.
      - agent_code:/agent/code
      # Shared by the candidates when there are two or more (#678): a host path of a shared volume.
      - ${SKELETON_AGENT_STATE_SOURCE:-agent_state}:/agent/state
      - releases:/releases
      - control:/control
      - control_state:/control-state:ro
      - ${SKELETON_CLUSTER_DIR:?Define the directory of the channel certificates and secret}:/run/cluster:ro
    healthcheck:
      # Healthy once the first installation is done and the control socket is served.
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(not stat.S_ISSOCK(os.stat('/control/agent.sock').st_mode))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30m
  web:
    <<: *hardened
    build: .
    image: ${SKELETON_IMAGE:-django-skeleton:local}
    ports: ["${SKELETON_WEB_BIND:-127.0.0.1}:${SKELETON_WEB_PORT:-8000}:8000"]
    # Waits for the agent, which starts it once this node runs the cluster's release; the agent stops
    # and restarts it through the control files around each update.
    command: ["python", "-m", "deployment_agent.launcher", "--service", "web", "--control", "/control/services", "--state", "/control-state", "--releases-root", "/releases", "--active", "/releases/current", "--grace", "30", "--wait-for-agent", "--", "{venv}/bin/gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "${SKELETON_WEB_WORKERS:-3}", "--threads", "${SKELETON_WEB_THREADS:-1}", "--timeout", "120", "--no-control-socket"]
    restart: unless-stopped
    env_file: *instance-env-file
    environment:
      <<: *app-environment
      SKELETON_REQUIRE_ADMIN_MFA: "true"
    volumes: *app-volumes
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      agent: {condition: service_started}
    healthcheck:
      # Resolves a Host the instance accepts without starting Django.
      test: ["CMD", "python", "-m", "skeleton.api.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start waits for the agent to install the release (or to join the cluster's).
      start_period: 30m
  # Job worker and periodic scheduler (#40): the same release, volumes and environment as web. Several
  # nodes run them at once safely (SKIP LOCKED, one job per window).
  worker:
    <<: *hardened
    image: ${SKELETON_IMAGE:-django-skeleton:local}
    build: .
    command: ["python", "-m", "deployment_agent.launcher", "--service", "worker", "--control", "/control/services", "--state", "/control-state", "--releases-root", "/releases", "--active", "/releases/current", "--grace", "300", "--wait-for-agent", "--", "{python}", "manage.py", "run_worker", "--queues", "default"]
    restart: unless-stopped
    stop_grace_period: 5m
    env_file: *instance-env-file
    environment: *app-environment
    volumes: *app-volumes
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      # With the paths the launcher gives the release (deployment_agent.launcher.release_environment).
      test: ["CMD", "sh", "-c", "cd /releases/current && SKELETON_PROJECT_ROOT=$$PWD SKELETON_DEPLOYMENT_INVENTORY=$$PWD/inventory.json PYTHONPATH=$$PWD exec .venv/bin/python manage.py check_jobs --max-lag 900"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 5m
  scheduler:
    <<: *hardened
    image: ${SKELETON_IMAGE:-django-skeleton:local}
    build: .
    command: ["python", "-m", "deployment_agent.launcher", "--service", "scheduler", "--control", "/control/services", "--state", "/control-state", "--releases-root", "/releases", "--active", "/releases/current", "--grace", "30", "--wait-for-agent", "--", "{python}", "manage.py", "run_scheduler", "--interval", "30"]
    restart: unless-stopped
    env_file: *instance-env-file
    environment: *app-environment
    volumes: *app-volumes
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      web: {condition: service_healthy}
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2-3
    profiles: ["integrations"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: fixture-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define disposable Keycloak admin password}
      KC_HOSTNAME: http://127.0.0.1:8080
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./tests/sso:/opt/keycloak/data/import:ro"]
volumes:
  files:
  agent_private:
  agent_code:
  agent_state:
  releases:
  control:
  control_state:
