[build-system]
requires = ["setuptools>=84.1,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "django-skeleton"
version = "0.5.0"
description = "Núcleo Django reutilizável com identidade e autorização por registros"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django==6.1.3",
    "django-allauth[socialaccount,mfa,saml]==65.21.1",
    "django-crispy-forms==2.7",
    "djangorestframework==3.18.3",
    "django-environ==0.14.0",
    "psycopg[binary]>=3.3.8,<4",
    "cryptography>=44",
    "redis>=5,<9",
    "gunicorn>=23",
    "whitenoise==6.12.0",
    "packaging>=24.2,<27",
    # Calendar recurrence (skeleton/contrib/calendar, #70).
    "python-dateutil>=2.9,<3",
    # Calendar export and feed (skeleton/contrib/calendar, #76).
    "icalendar>=6.1,<8",
    # Verified email domains: TXT challenge lookups (skeleton/tenancy/domains.py, #28).
    "dnspython>=2.7,<3",
]

[project.optional-dependencies]
# Private attachment storage on S3 (STORAGES["skeleton_files"] with SKELETON_FILES_BACKEND=s3).
s3 = ["django-storages[s3]>=1.14,<2", "boto3>=1.34,<2"]
# Observability (#87): each extra is off by default and imported only when configured.
# Prometheus metrics at /metrics, behind SKELETON_METRICS_TOKEN (#175).
metrics = ["prometheus-client>=0.21,<1"]
# OpenTelemetry traces over OTLP/HTTP, configured by the standard OTEL_* variables (#176).
otel = [
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-django>=0.51b0,<1",
    "opentelemetry-instrumentation-psycopg>=0.51b0,<1",
]
# Error reporting to Sentry with PII and secrets removed, behind SKELETON_SENTRY_DSN (#177).
sentry = ["sentry-sdk>=2.20,<3"]

[project.scripts]
skeleton-core = "skeleton.distribution:main"

[tool.setuptools.packages.find]
include = ["skeleton", "skeleton.*"]
exclude = ["config*", "applications*", "examples*", "deployment_agent*", "tests*", "tools*"]

[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*", "*.json", "*.sql", "docs/**/*"]
"skeleton" = ["py.typed"]
"skeleton.system" = ["app_template/*"]  # modelos do skeleton_startapp (*.py-tpl não são módulos)

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "posix: exige APIs de sistema de arquivos POSIX (os.O_NOFOLLOW, fcntl); pulado em outras plataformas",
    "closed_app_defaults: o skeleton_db não abre nem ativa as apps (prova o default fechado, #22)",
]

[tool.coverage.run]
branch = true
source = ["skeleton", "deployment_agent"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".private", "staticfiles"]

[tool.ruff.lint]
# Linha de base aplicada a todo o repositório. E501 (strings SQL/HTML longas que o
# formatter não quebra) e PLC0415 (imports tardios contra ciclos de apps) ficam fora.
select = ["F", "E9", "B", "UP", "DJ", "I"]
ignore = [
    "DJ012",  # ordem de membros em modelos abstratos é estilística
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # overlays herdam os defaults por star import
"tests/**" = ["DJ008"]
"**/migrations/**" = ["I"]  # migrations históricas não são reescritas

[tool.ruff.lint.isort]
known-first-party = ["applications", "config", "deployment_agent", "examples", "skeleton", "tests", "tools"]

[tool.ruff.format]
exclude = ["**/migrations/**"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# Adoção gradual: estes módulos são checados em modo estrito; os demais são
# importados em silêncio até ganharem anotações próprias.
files = [
    "skeleton/tenancy/context.py",
    "skeleton/access/policies.py",
    "skeleton/common/models.py",
    "skeleton/system/dependencies.py",
    "skeleton/service_api",
    "skeleton/testing",
    "skeleton/system/import_boundary.py",
    "skeleton/common/outbound_http.py",
    "skeleton/instance/schema.py",
    "skeleton/instance/store.py",
    "skeleton/instance/crypto.py",
    "skeleton/instance/resolve.py",
    "skeleton/observability/__init__.py",
    "skeleton/observability/checks.py",
    "skeleton/observability/metrics.py",
    "skeleton/observability/otel.py",
    "skeleton/observability/sentry.py",
    "skeleton/observability/tracing.py",
]
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "skeleton.tenancy.context",
    "skeleton.access.policies",
    "skeleton.common.models",
    "skeleton.system.dependencies",
    "skeleton.service_api.*",
    "skeleton.testing.*",
    "skeleton.system.import_boundary",
    "skeleton.common.outbound_http",
    "skeleton.instance.schema",
    "skeleton.instance.store",
    "skeleton.instance.crypto",
    "skeleton.instance.resolve",
    "skeleton.observability.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
