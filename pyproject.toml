[build-system]
requires = ["setuptools>=77,<83", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "django-skeleton"
version = "0.3.0"
description = "Núcleo Django reutilizável com identidade e autorização por registros"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django==5.2.18",
    "django-allauth[socialaccount,mfa,saml]==65.19.7",
    "django-crispy-forms==2.7",
    "djangorestframework==3.18.3",
    "django-environ==0.14.0",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=44",
    "redis>=5,<9",
    "gunicorn>=23",
    "whitenoise==6.12.0",
    "packaging>=24.2,<27",
]

[project.scripts]
skeleton-core = "skeleton.distribution:main"

[tool.setuptools.packages.find]
include = ["skeleton", "skeleton.*"]
exclude = ["config*", "applications*", "examples*", "deployment_agent*", "tests*", "tools*"]

[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*", "*.json", "*.sql", "docs/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-ra"
