# Instale com `pre-commit install`: instala os hooks pre-commit e commit-msg.
# A mesma versão do Ruff roda no CI.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
  - repo: local
    hooks:
      # Todo commit referencia uma issue (Refs #N); skill dev-workflow e docs/workflow.md.
      - id: issue-reference
        name: referência a issue do GitHub
        entry: python .claude/skills/dev-workflow/scripts/github_issues.py commit-msg
        language: python
        stages: [commit-msg]
