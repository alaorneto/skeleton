name: Enhancement
description: "Improvement to something that already exists (UX, performance, ergonomics)."
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Improvement to an existing feature.
        Fill in every section; write "Not applicable — reason" when that is the case. Flow: dev-workflow skill.
  - type: textarea
    id: contexto
    attributes:
      label: "Context"
      description: "Current problem, who is affected and why now. Link to a plan or discussion."
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: "Goal"
      description: "Expected result in 1–3 sentences."
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: "Scope"
      description: "What is in and what is out (and where it will be handled)."
      placeholder: |
        **Includes**
        - 
        
        **Out of scope**
        - 
    validations:
      required: true
  - type: textarea
    id: abordagem
    attributes:
      label: "Technical approach"
      description: "Affected modules/files, decisions, architecture boundaries involved."
      placeholder: |
        - Modules and files: 
        - Decisions: 
        - Architecture boundaries: 
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: "Acceptance criteria"
      description: "Observable, verifiable behaviors, including negative ones."
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: testes
    attributes:
      label: "Test plan"
      description: "Layers, security negatives and commands. Write \"Not applicable — reason\" when that is the case."
      placeholder: |
        - [ ] Unit (tests/unit): 
        - [ ] Integration: 
        - [ ] Negative (what must be refused): 
        - [ ] Manual/browser smoke test: 
        
        Commands:
    validations:
      required: true
  - type: textarea
    id: documentacao
    attributes:
      label: "Documentation to update"
      description: "Documentation files that change with this delivery."
      placeholder: |
        - [ ] docs/....md — 
    validations:
      required: true
  - type: textarea
    id: riscos
    attributes:
      label: "Risks and dependencies"
      description: "Epic and dependencies count through the native link: parent (sub-issue) and blocked by, in the side panel or with gh issue edit --parent/--add-blocked-by. Repeat them here as text, with migrations, compatibility and rollback."
      placeholder: |
        - Part of / depends on: 
        - Migrations and rollback: 
    validations:
      required: false
  - type: checkboxes
    id: pronto
    attributes:
      label: "Definition of done"
      description: "Checked before closing (dev-workflow skill)."
      options:
        - label: "Acceptance criteria verified"
        - label: "Test plan run and recorded (only what actually ran)"
        - label: "Documentation updated"
        - label: "CI green"
        - label: "Commits with Refs #N and PR with Closes #N"
        - label: "Approved by the owner"
