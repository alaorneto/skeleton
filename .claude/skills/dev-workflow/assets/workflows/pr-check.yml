name: Verificação do PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    name: Verificação do PR
    runs-on: ubuntu-24.04
    steps:
      # Só a configuração e os scripts da branch base: o código do PR nunca roda aqui.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Conferir issue, seções, título e classificação de versão
        # Título, corpo, autor e labels entram por variável de ambiente, nunca interpolados no script.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 {{SKILL_DIR}}/scripts/github_issues.py check-pr
