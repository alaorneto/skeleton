name: Autoteste do skill dev-workflow

# Roda a suíte do próprio skill (só biblioteca padrão e git) nos três sistemas e em cada versão do
# Python suportada, com Node para o hook do Claude Code, quando ele muda. No repositório do skill,
# que traz ruff.toml e mypy.ini, também o lint e os tipos; na cópia dentro de um projeto esses
# arquivos não vêm e os passos são pulados.

on:
  pull_request:
    paths: ["__SKILL_GLOB__", ".github/dev-workflow.toml"]
  push:
    branches: [__DEFAULT_BRANCH__]
    paths: ["__SKILL_GLOB__", ".github/dev-workflow.toml"]

permissions:
  contents: read

concurrency:
  group: dev-workflow-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: Suíte do skill (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Testes do skill
        run: python __SKILL_DIR__/tests/run.py --durations 10

  lint:
    name: Lint e tipos do skill
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: __SKILL_DIR__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: hashFiles('__SKILL_PATH__ruff.toml') != ''
        with:
          python-version: "3.11"
      - name: Ferramentas
        if: hashFiles('__SKILL_PATH__ruff.toml') != ''
        run: python -m pip install --disable-pip-version-check ruff==0.17.6 mypy==2.4.1
      - name: Lint (ruff)
        if: hashFiles('__SKILL_PATH__ruff.toml') != ''
        run: python -m ruff check --output-format github .
      - name: Tipos (mypy)
        if: hashFiles('__SKILL_PATH__ruff.toml') != ''
        run: python -m mypy
