# Configuração do skill dev-workflow (references/configuration.md). Tudo que é específico do
# projeto fica aqui; os scripts do skill recusam chave desconhecida ou valor inválido.

[project]
default_branch = "main"
language = "pt"

# Labels de tipo: cada issue tem exatamente um. `commit` lista os tipos de Conventional Commits
# que correspondem ao label; `level` é o nível SemVer que uma mudança desse tipo implica.
[types.bug]
heading = "Correções"
color = "d73a4a"
description = "Comportamento incorreto, regressão ou falha de segurança existente"
commit = ["fix"]
level = "patch"

[types.feature]
heading = "Funcionalidades"
color = "1d76db"
description = "Nova funcionalidade"
commit = ["feat"]
level = "minor"

[types.enhancement]
heading = "Melhorias"
color = "a2eeef"
description = "Melhoria de funcionalidade existente"
commit = ["perf"]
level = "minor"

[types.documentation]
heading = "Documentação"
color = "0075ca"
description = "Somente documentação"
commit = ["docs"]
level = "patch"

[types.refactor]
heading = "Refatoração"
color = "fbca04"
description = "Reestruturação sem mudança de comportamento"
commit = ["refactor", "style"]
level = "patch"

[types.test]
heading = "Testes"
color = "bfd4f2"
description = "Somente testes, fixtures ou evidência de verificação"
commit = ["test"]
level = "patch"

[types.ci]
heading = "CI"
color = "5319e7"
description = "Pipeline e checks automáticos"
commit = ["ci"]
level = "patch"

[types.chore]
heading = "Manutenção"
color = "c5def5"
description = "Dependências, ferramentas e configuração de desenvolvimento"
commit = ["chore", "build", "revert"]
level = "patch"

# Labels adicionais. `epic` marca a issue de acompanhamento de um plano.
[labels.security]
color = "b60205"
description = "Impacto em isolamento, autorização, autenticação, auditoria ou segredos"

[labels.epic]
color = "3e4b9e"
description = "Acompanhamento de um plano com várias issues"

[labels.release]
color = "0e8a16"
description = "O merge deste PR gera uma versão nova"

[labels.breaking-change]
color = "b60205"
description = "Quebra de compatibilidade da superfície pública"

[labels."semver:major"]
color = "5d1f1f"
description = "Força versão major (informe o motivo no PR)"

[labels."semver:minor"]
color = "8a4b08"
description = "Força versão minor (informe o motivo no PR)"

[labels."semver:patch"]
color = "c2e0c6"
description = "Força versão patch (informe o motivo no PR)"

[issue]
epic_label = "epic"
items_section = "Itens"
depends_marker = "depende de"
# Seções que toda issue tem, qualquer que seja o tipo; o check de PR avisa quando faltam.
sections = ["Critérios de aceite", "Definição de pronto"]

[pull_request]
sections = ["Issues", "Resumo", "Versão", "Testes executados", "Documentação"]
exempt_authors = ["dependabot[bot]"]
conventional_title = true
pending_criteria = "warning"

[versioning]
enabled = false
tag_prefix = "v"
changelog = "CHANGELOG.md"
release_label = "release"
breaking_label = "breaking-change"
override_prefix = "semver:"
mode = "direct"
analysis_authors = ["github-actions[bot]"]
# files = [{ path = "pyproject.toml", regex = '^version = "(?P<version>[^"]+)"', replace = 'version = "{version}"' }]
files = []
public_surfaces = []
floors = []
