{% for group in app_groups %}<section class="application-models" aria-labelledby="app-{{ group.app_label }}"><h2 id="app-{{ group.app_label }}">{{ group.label }}</h2><div class="grid">{% for spec in group.models %}<section class="card"><h3>{{ spec.label }}</h3>{% if spec.description %}<p>{{ spec.description }}</p>{% endif %}<a href="{% url 'web:records' organization_id spec.table_key %}">Consultar registros</a></section>{% endfor %}</div></section>{% empty %}<p class="empty-state">Nenhuma tabela autorizada.</p>{% endfor %}
