{% load i18n skeleton_format %}{% with input_type=field.field.widget.input_type required=field|is_required %}<div class="form-field{% if input_type == 'checkbox' or input_type == 'radio' %} form-field-check{% endif %}">
{% if input_type == 'checkbox' %}{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if not hide_marks %}{% if required %}<span class="required" aria-hidden="true"> *</span>{% else %} <span class="optional">{% translate "(opcional)" %}</span>{% endif %}{% endif %}</label>{{ field }}{% endif %}
{% if field.help_text %}<div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
{{ field.errors }}
</div>{% endwith %}
