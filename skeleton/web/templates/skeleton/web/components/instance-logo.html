{% comment %}The instance logo (#598), with the dark-mode variant when it exists. Needs logo (an instance_brand), class and alt.{% endcomment %}{% if logo.logo_dark_url %}<picture><source media="(prefers-color-scheme: dark)" srcset="{{ logo.logo_dark_url }}"><img class="{{ class }}" src="{{ logo.logo_url }}" alt="{{ alt }}"></picture>{% else %}<img class="{{ class }}" src="{{ logo.logo_url }}" alt="{{ alt }}">{% endif %}
