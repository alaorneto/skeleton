{% if filters %}<form method="get" class="filter-panel"><h2>Filtros exatos</h2><div class="section-fields columns-2">{% for filter in filters %}<div class="field"><label for="filter-{{ filter.name }}">{{ filter.label }}</label><input id="filter-{{ filter.name }}" name="{{ filter.name }}" value="{{ filter.value }}"></div>{% endfor %}</div><div class="toolbar"><button type="submit">Filtrar</button><a href="?">Limpar filtros</a></div></form>{% endif %}
