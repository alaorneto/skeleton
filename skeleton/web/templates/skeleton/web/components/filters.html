{% if filters %}<details class="filter-panel"{% for filter in filters %}{% if filter.value %} open{% endif %}{% endfor %}><summary>{% include "skeleton/web/components/icon.html" with name="filter" %}Filtros exatos{% include "skeleton/web/components/icon.html" with name="chevron-down" class="chevron ms-auto size-4" %}</summary><form method="get"><div class="section-fields">{% for filter in filters %}<div class="field field-span-4"><label for="filter-{{ filter.name }}">{{ filter.label }}</label><input id="filter-{{ filter.name }}" name="{{ filter.name }}" value="{{ filter.value }}"></div>{% endfor %}</div><div class="toolbar"><button type="submit" class="btn btn-primary">Filtrar</button><a class="btn btn-secondary" href="?">Limpar filtros</a></div></form></details>{% endif %}
