{% load i18n %}{% comment %}Zona de perigo (#769): uma ação destrutiva separada do resto da tela, com a consequência em uma frase. O botão leva à página de confirmação. Parâmetros: title, text, url, label; heading_id opcional.{% endcomment %}<section class="danger-zone" aria-labelledby="{{ heading_id|default:'danger-zone' }}"><div class="min-w-0"><h2 id="{{ heading_id|default:'danger-zone' }}" class="danger-zone-title">{{ title }}</h2><p class="danger-zone-text">{{ text }}</p></div><a class="btn btn-danger-outline" href="{{ url }}">{{ label }}</a></section>
