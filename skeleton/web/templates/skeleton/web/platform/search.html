<form method="get" role="search" class="mb-4 flex max-w-xl gap-2">
  <label for="platform-search" class="sr-only">Buscar</label>
  <input id="platform-search" type="search" name="q" value="{{ q }}" placeholder="{{ placeholder|default:'Buscar' }}">
  <button type="submit" class="btn btn-secondary">{% include "skeleton/web/components/icon.html" with name="search" %}Buscar</button>
  {% if q %}<a class="btn btn-ghost" href="?">Limpar</a>{% endif %}
</form>
