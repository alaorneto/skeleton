{% load i18n %}<section class="card mt-5" aria-labelledby="flow-diagram"><h2 id="flow-diagram" class="mb-4">{% translate "Diagrama" %}</h2>
<div class="table-scroll"><svg role="img" aria-labelledby="flow-diagram-title" width="{{ diagram.width }}" height="{{ diagram.height }}" viewBox="0 0 {{ diagram.width }} {{ diagram.height }}" class="text-body" data-flow-diagram>
<title id="flow-diagram-title">{% translate "Etapas e transições do fluxo, com a etapa atual destacada" %}</title>
<defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs>
{% for edge in diagram.edges %}<line x1="{{ edge.x1 }}" y1="{{ edge.y1 }}" x2="{{ edge.x2 }}" y2="{{ edge.y2 }}" stroke="currentColor" stroke-opacity="0.5" {% if edge.back %}stroke-dasharray="4 3" {% endif %}marker-end="url(#flow-arrow)"/>{% endfor %}
{% for node in diagram.nodes %}<g data-step="{{ node.key }}" data-state="{{ node.state }}"><rect x="{{ node.x }}" y="{{ node.y }}" width="{{ diagram.node_width }}" height="{{ diagram.node_height }}" rx="8" fill="{% if node.state == 'active' %}#dbeafe{% elif node.state == 'done' %}#dcfce7{% else %}#f3f4f6{% endif %}" stroke="{% if node.state == 'active' %}#1d4ed8{% else %}currentColor{% endif %}" stroke-width="{% if node.state == 'active' %}2.5{% else %}1{% endif %}"/><text x="{{ node.text_x }}" y="{{ node.text_y }}" text-anchor="middle" font-size="12" fill="#111827">{{ node.label }}</text></g>{% endfor %}
</svg></div>
<ul class="sr-only">{% for node in diagram.nodes %}<li>{{ node.label }} ({{ node.kind }}){% if node.state == "active" %} — {% translate "etapa atual" %}{% elif node.state == "done" %} — {% translate "concluída" %}{% endif %}</li>{% endfor %}</ul>
</section>
