{% extends "skeleton/email/base.html" %}{% load i18n %}
{% block content %}<p style="margin:0 0 16px 0">{% blocktranslate trimmed with name=organization_name %}Você recebeu um convite para {{ name }}.{% endblocktranslate %}</p>
<p style="margin:0 0 16px 0"><a href="{{ url }}" style="display:inline-block;background:{{ brand_color }};color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:6px;font-weight:bold">{% translate "Aceitar o convite" %}</a></p>
<p style="margin:0;color:#6b7280;font-size:12px">{% translate "O convite expira em sete dias." %}</p>{% endblock %}
