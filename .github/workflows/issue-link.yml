name: Vínculo com issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-link:
    name: PR vinculado a issue classificada
    # PRs de dependências automáticas não nascem de planos; o resto segue docs/workflow.md.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Conferir Closes/Refs e label de tipo das issues
        # O corpo entra por variável de ambiente, nunca interpolado no script.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/workflow/github_issues.py check-pr
