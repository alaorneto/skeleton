name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Bibliotecas nativas exigidas pelos wheels SAML travados (mesmas do Dockerfile).
  SYSTEM_PACKAGES: libxml2 libxmlsec1 libxmlsec1-openssl xmlsec1
  # #721: an apt mirror that stalls fails the request instead of hanging the runner. Every apt
  # step also has its own timeout and every job one above its usual duration (docs/testing.md).
  APT_OPTIONS: >-
    -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
    -o DPkg::Lock::Timeout=120

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The local hooks again, for commits made without pre-commit installed (#329). The Ruff
      # hooks are skipped (the steps below run them) and commit-msg is not a pre-commit stage.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Hooks do pre-commit (exceto o commit-msg)
        run: uvx pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.4"
          args: check --output-format github
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.4"
          args: format --check --diff

  assets:
    name: CSS compilado e assets vendorizados
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar lock do frontend (sem scripts de instalação)
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Conferir que static/ corresponde às fontes (Tailwind, Flowbite, Inter)
        # Falha se site.css/admin.css ou os arquivos de vendor/ estiverem desatualizados.
        working-directory: frontend
        run: npm run check
      - name: Testes do editor de texto formatado (dialeto, conversão e comandos)
        # O corpus de tests/fixtures/markdown é o mesmo que tests/unit/test_markdown.py confere.
        working-directory: frontend
        run: npm test

  locks:
    name: Locks correspondem aos requirements .in
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Versão fixa: o formato e o cabeçalho do lock dependem do uv.
          version: "0.12.7"
          enable-cache: false
      - name: Regenerar os locks e exigir diff vazio
        # Com -o, o uv usa o lock existente como preferência: só há diff quando
        # um .in mudou sem regenerar ou o lock foi gerado por outra ferramenta.
        run: |
          uv pip compile --python-version 3.14 --python-platform x86_64-manylinux_2_28 --generate-hashes requirements.in -o requirements.txt
          uv pip compile --python-version 3.14 --python-platform x86_64-manylinux_2_28 --generate-hashes requirements-dev.in -o requirements-dev.txt
          if ! git diff --exit-code -- requirements.txt requirements-dev.txt; then
            echo "::error::requirements.txt/requirements-dev.txt não correspondem aos .in. Regenere com os comandos de 'Atualizar locks' do README.md (uv 0.12.7) e commite o diff."
            exit 1
          fi

  tests:
    name: Testes em PostgreSQL (Python ${{ matrix.python }}, ${{ matrix.suite }}, role runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        # Cada suíte é dividida em fatias de arquivos equilibradas pelo custo dos testes
        # (tools/suite_shards.py, #757): juntas, as fatias de uma suíte são a suíte inteira. Para
        # mudar o número de fatias, acrescente ou remova itens e troque N em todas as da suíte.
        slug: [core-1, core-2, core-3, core-4, core-5, core-6, apps-1, apps-2]
        include:
          - { slug: core-1, suite: "núcleo 1/6", paths: tests, shard: "1/6" }
          - { slug: core-2, suite: "núcleo 2/6", paths: tests, shard: "2/6" }
          - { slug: core-3, suite: "núcleo 3/6", paths: tests, shard: "3/6" }
          - { slug: core-4, suite: "núcleo 4/6", paths: tests, shard: "4/6" }
          - { slug: core-5, suite: "núcleo 5/6", paths: tests, shard: "5/6" }
          - { slug: core-6, suite: "núcleo 6/6", paths: tests, shard: "6/6" }
          # The first-party apps: their own suites, with the apps installed.
          - { slug: apps-1, suite: "agenda e livro contábil 1/2", paths: tests/contrib, shard: "1/2", bundled: "calendar,ledger" }
          - { slug: apps-2, suite: "agenda e livro contábil 2/2", paths: tests/contrib, shard: "2/2", bundled: "calendar,ledger" }
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: ci-superuser-only
          # Container descartável: não espera o disco, e a tabela de locks comporta um worker
          # por vCPU recriando o schema ao mesmo tempo (cerca de 2.100 locks por restauração).
          POSTGRES_INITDB_ARGS: >-
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
            -c max_locks_per_transaction=2048
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SKELETON_ENABLE_EXAMPLE_APP: "true"
      # Tests marked needs_example_app fail instead of skipping without the example app (#264).
      SKELETON_TEST_REQUIRE_EXAMPLE_APP: "1"
      # The core suite runs without first-party apps (#66); each one adds its own suite.
      SKELETON_BUNDLED_APPS: ${{ matrix.bundled || '' }}
      SKELETON_TEST_ALLOW_SCHEMA_RESET: "1"
      # As assertions usam skeleton_runtime (NOSUPERUSER, NOBYPASSRLS); o owner só migra.
      # Com pytest -n, cada worker deriva o seu banco: ci_gw0_skeleton_test, ci_gw1_...
      TEST_DATABASE_URL: postgres://skeleton_runtime:ci-runtime@127.0.0.1:5432/ci_skeleton_test
      # The followers' role of the agents' coordination (#678): only schema skeleton_deploy.
      TEST_AGENT_DATABASE_URL: postgres://skeleton_agent:ci-agent@127.0.0.1:5432/ci_skeleton_test
      TEST_MIGRATION_DATABASE_URL: postgres://skeleton_owner:ci-owner@127.0.0.1:5432/ci_skeleton_test
      # Um worker por vCPU do runner; o passo de provisionamento cria um banco para cada um.
      TEST_WORKERS: "4"
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-superuser-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências do sistema
        # redis-server alimenta o teste do healthcheck renderizado pelo Compose; o cliente
        # PostgreSQL provisiona o banco e gera o template de schema (pg_dump).
        timeout-minutes: 10
        run: |
          apt_install() { sudo apt-get $APT_OPTIONS update && sudo apt-get $APT_OPTIONS install -y --no-install-recommends $SYSTEM_PACKAGES redis-server postgresql-client; }
          apt_install || { echo "::warning::apt-get falhou; nova tentativa em 15 s"; sleep 15; apt_install; }
      - name: Provisionar bancos descartáveis e roles
        run: |
          for database in ci_skeleton_test $(seq -f 'ci_gw%g_skeleton_test' 0 $((TEST_WORKERS - 1))); do
            createdb "$database"
            psql -q -v ON_ERROR_STOP=1 -d "$database" -f deploy/postgres/bootstrap.sql
            # O GRANT permite que reset_schema() recrie o schema skeleton como owner.
            psql -q -v ON_ERROR_STOP=1 -d "$database" -c "GRANT CREATE ON DATABASE $database TO skeleton_owner"
          done
          psql -v ON_ERROR_STOP=1 -d ci_skeleton_test \
            -c "ALTER ROLE skeleton_owner PASSWORD 'ci-owner'" \
            -c "ALTER ROLE skeleton_runtime PASSWORD 'ci-runtime'" \
            -c "ALTER ROLE skeleton_agent PASSWORD 'ci-agent'" \
            -c "SELECT name, setting FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes', 'max_locks_per_transaction')"
      - name: Instalar lock com hashes
        # Os testes de Compose invocam .venv/bin/python, então o venv fica na raiz.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Django checks
        # Uma vez por Python e por conjunto de apps: na primeira fatia do núcleo e na das apps.
        if: matrix.slug == 'core-1' || matrix.slug == 'apps-1'
        run: |
          .venv/bin/python manage.py check --fail-level WARNING
          .venv/bin/python manage.py makemigrations --check --dry-run
      - name: Fatia ${{ matrix.shard }} de ${{ matrix.paths }} com cobertura
        env:
          COVERAGE_FILE: coverage-data/coverage.py${{ matrix.python }}.${{ matrix.slug }}
          # One real migration per job (#757): the first worker migrates and the others restore its
          # template. The directory is the runner's own, empty at every run (#350): no template of
          # another run or of another job is ever reused.
          SKELETON_TEST_TEMPLATE_CACHE: ${{ runner.temp }}/template-cache
        run: |
          mkdir -p coverage-data
          # A slice covers only part of the code: the floor (fail_under) applies to the combined
          # report of the "coverage" job, never to a slice (#329). The slices of the first-party
          # apps add to the same report: their code is part of the package.
          .venv/bin/python -m pytest "${{ matrix.paths }}" -q -n "$TEST_WORKERS" --shard "${{ matrix.shard }}" --cov --cov-report= --cov-fail-under=0
      - name: Smoke de segurança do runtime
        if: matrix.python == '3.14' && matrix.slug == 'core-1'
        run: .venv/bin/python tools/smoke_postgres.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-data-py${{ matrix.python }}-${{ matrix.slug }}
          path: coverage-data/
          if-no-files-found: error

  coverage:
    name: Cobertura da suíte (Python ${{ matrix.python }})
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-data-py${{ matrix.python }}-*
          path: coverage-data
          merge-multiple: true
      - name: Combinar a cobertura das fatias
        # Mesma medição de antes da divisão: a suíte do núcleo inteira, por Python.
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          # Arquivos nomeados: num diretório, o coverage só procura nomes ".coverage*", e o
          # upload-artifact deixa arquivos ocultos de fora.
          python -m coverage combine coverage-data/coverage.*
          python -m coverage report
          python -m coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-postgres-py${{ matrix.python }}
          path: coverage.xml

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Instalar dependências do sistema
        # gettext: makemessages e msgfmt do passo de tradução.
        timeout-minutes: 10
        run: |
          apt_install() { sudo apt-get $APT_OPTIONS update && sudo apt-get $APT_OPTIONS install -y --no-install-recommends $SYSTEM_PACKAGES gettext; }
          apt_install || { echo "::warning::apt-get falhou; nova tentativa em 15 s"; sleep 15; apt_install; }
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: mypy (módulos listados em pyproject.toml)
        # The first-party apps are checked strictly (#348): the Django plugin must load their models.
        env:
          SKELETON_BUNDLED_APPS: calendar,ledger
        run: python -m mypy
      - name: Catálogo de tradução válido (makemessages e msgfmt --check-format)
        run: python tools/i18n_check.py

  deploy-check:
    name: Settings de produção (check --deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Instalar dependências do sistema
        timeout-minutes: 10
        run: |
          apt_install() { sudo apt-get $APT_OPTIONS update && sudo apt-get $APT_OPTIONS install -y --no-install-recommends $SYSTEM_PACKAGES; }
          apt_install || { echo "::warning::apt-get falhou; nova tentativa em 15 s"; sleep 15; apt_install; }
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: manage.py check --deploy
        # Valores descartáveis: o check não conecta ao banco, cache ou SMTP.
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export MFA_ENCRYPTION_KEYS="$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: ci.example.test
          DATABASE_URL: postgres://skeleton_runtime:unused@127.0.0.1:1/unused
          CACHE_URL: rediscache://127.0.0.1:1/0
          SKELETON_CACHE_KEY_PREFIX: ci
          EMAIL_URL: smtp://127.0.0.1:1
          DEFAULT_FROM_EMAIL: ci@example.test
          SKELETON_PUBLIC_URL: https://ci.example.test

  build:
    name: Wheel, auditoria e imagem
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Instalar dependências do sistema
        timeout-minutes: 10
        run: |
          apt_install() { sudo apt-get $APT_OPTIONS update && sudo apt-get $APT_OPTIONS install -y --no-install-recommends $SYSTEM_PACKAGES; }
          apt_install || { echo "::warning::apt-get falhou; nova tentativa em 15 s"; sleep 15; apt_install; }
      - name: Construir wheel do núcleo
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Construir e instalar o wheel do agente
        # A distribuição separada do operador (#309): construída, instalada num venv limpo só com
        # o lock e executável. Os pins de execução dela coincidem com o lock auditado abaixo.
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist-agent ./deployment_agent
          python -m venv /tmp/agent-venv
          /tmp/agent-venv/bin/python -m pip install --require-hashes -r requirements.txt
          /tmp/agent-venv/bin/python -m pip install --no-deps dist/*.whl dist-agent/*.whl
          /tmp/agent-venv/bin/python -m pip check
          /tmp/agent-venv/bin/skeleton-deployment-agent --help
      - name: Ensaio dos artefatos de release
        # #496: o mesmo build do workflow de artefatos, com chave efêmera (nenhum segredo em PR).
        # Baixa os wheels do lock com --require-hashes e instala tudo sem rede num venv de verificação.
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python tools/release_artifacts.py build --ephemeral-key --version "$version" --tag "v$version"             --core-wheel "dist/django_skeleton-$version-py3-none-any.whl"             --agent-wheel "dist-agent/skeleton_deployment_agent-$version-py3-none-any.whl"             --verify-install --out "$RUNNER_TEMP/release-rehearsal"
          python -m skeleton.system.packages validate "$RUNNER_TEMP"/release-rehearsal/*.release.skapp             --trust-store "$RUNNER_TEMP/release-rehearsal/trust.json"
          python -m skeleton.system.packages validate-index "$RUNNER_TEMP/release-rehearsal/skeleton-index.json"             --trust-store "$RUNNER_TEMP/release-rehearsal/trust.json"
      - name: Auditar dependências travadas
        # pip-audit isolado: nada é instalado no ambiente em que o lock foi instalado.
        run: |
          python -m pip install --target /tmp/pip-audit "pip-audit==2.9.0"
          PYTHONPATH=/tmp/pip-audit python -m pip_audit --strict --require-hashes --disable-pip -r requirements.txt
          PYTHONPATH=/tmp/pip-audit python -m pip_audit --strict --require-hashes --disable-pip -r requirements-dev.txt
      - name: Construir imagem
        run: docker build --tag django-skeleton:ci .
      - name: Contexto de build não vira camada
        run: |
          docker build --target project-assets --tag django-skeleton:assets .
          docker run --rm django-skeleton:assets sh -c '! test -e /project-source'
      - name: Validar o compose do sandbox (#369, #654)
        env:
          SANDBOX_HOST: sandbox.example.test
          POSTGRES_PASSWORD: ci
          SKELETON_OWNER_DB_PASSWORD: ci
          SKELETON_RUNTIME_DB_PASSWORD: ci
          REDIS_PASSWORD: ci
        run: |
          config=$(docker compose -f compose.sandbox.yaml config --format json)
          # Nenhuma porta no host: o proxy do Coolify chega ao web pela rede interna.
          echo "$config" | jq -e '[.services[] | select(.ports)] == []'
          # A URL owner só no agente (#654); a senha owner só no init do PostgreSQL; ninguém com o socket Docker.
          echo "$config" | jq -e '[.services | to_entries[] | select(.value.environment | tostring | test("skeleton_owner")) | .key] == ["agent"]'
          echo "$config" | jq -e '[.services | to_entries[] | select(.value.environment.SKELETON_OWNER_DB_PASSWORD) | .key] == ["postgres"]'
          echo "$config" | jq -e '[.services[] | .volumes[]? | .source // "" | select(test("docker.sock"))] == []'
          echo "$config" | jq -e '(.services | has("migrate") | not) and (.services.agent.build.target == "agent")'
          # Tudo ligado no sandbox (#649).
          echo "$config" | jq -e '.services.web.environment.SKELETON_BILLING_ENABLED == "true" and .services.web.environment.SKELETON_BUNDLED_APPS == "calendar,ledger"'
          # Em modo setup o healthcheck manda Host: localhost; sem ele o web nunca fica saudável (#436).
          echo "$config" | jq -e '.services.web.environment.SKELETON_SETUP_ALLOWED_HOSTS | split(",") | index("localhost") != null'
          # Atrás do TLS do Coolify o setup confia no X-Forwarded-Proto, sem origem CSRF no ambiente (#442).
          echo "$config" | jq -e '.services.web.environment.SKELETON_SETUP_TRUST_PROXY == "true"'
          echo "$config" | jq -e '[.services[] | select(.environment.DJANGO_CSRF_TRUSTED_ORIGINS)] == []'
          # Sem uma variável obrigatória, o compose recusa em vez de subir com valor vazio.
          if env -u REDIS_PASSWORD docker compose -f compose.sandbox.yaml config --quiet 2>/dev/null; then
            echo "compose.sandbox.yaml aceitou REDIS_PASSWORD ausente" >&2
            exit 1
          fi
      - name: Validar o compose do servidor de dados (#679)
        env:
          DATA_BIND_ADDRESS: 10.0.0.5
          DATA_CLIENT_CIDR: 10.0.1.0/24
          DATA_TLS_DIR: /srv/data/tls
          POSTGRES_PORT: "5433"
          REDIS_PORT: "6380"
          POSTGRES_PASSWORD: ci
          SKELETON_OWNER_DB_PASSWORD: ci
          SKELETON_RUNTIME_DB_PASSWORD: ci
          REDIS_PASSWORD: ci
        run: |
          config=$(docker compose -p ci-a -f deploy/data-server/compose.yaml --profile pooler config --format json)
          # Só o endereço privado do servidor de dados; nada em 0.0.0.0.
          echo "$config" | jq -e '[.services[] | .ports[]? | .host_ip] | all(. == "10.0.0.5")'
          echo "$config" | jq -e '.services.postgres.environment.DATA_CLIENT_CIDR == "10.0.1.0/24"'
          echo "$config" | jq -e '.services.postgres.command | index("ssl=on") != null'
          # Sem uma variável obrigatória, o compose recusa.
          for name in DATA_BIND_ADDRESS DATA_CLIENT_CIDR DATA_TLS_DIR POSTGRES_PORT SKELETON_RUNTIME_DB_PASSWORD REDIS_PASSWORD; do
            if env -u "$name" docker compose -p ci-a -f deploy/data-server/compose.yaml config --quiet 2>/dev/null; then
              echo "deploy/data-server/compose.yaml aceitou $name ausente" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-wheel
          path: dist/*.whl

  compose-stack:
    name: Stack Compose em dois nós
    # #654, #685: a stack real a partir de um pacote de release de ensaio (chave efêmera, sem rede
    # para o release): o servidor de dados num projeto, dois nós de app (um candidato e um seguidor)
    # contra ele, a primeira partida pelo primário, o seguidor entrando pelo canal entre agentes e as
    # fronteiras da credencial owner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: cipostgres
      SKELETON_OWNER_DB_PASSWORD: ciowner
      SKELETON_RUNTIME_DB_PASSWORD: ciruntime
      SKELETON_AGENT_DB_PASSWORD: ciagent
      REDIS_PASSWORD: ciredis
      KEYCLOAK_ADMIN_PASSWORD: unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Instalar dependências do sistema
        timeout-minutes: 10
        run: |
          apt_install() { sudo apt-get $APT_OPTIONS update && sudo apt-get $APT_OPTIONS install -y --no-install-recommends $SYSTEM_PACKAGES; }
          apt_install || { echo "::warning::apt-get falhou; nova tentativa em 15 s"; sleep 15; apt_install; }
      - name: Pacote de release de ensaio
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist-agent ./deployment_agent
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python tools/release_artifacts.py build --ephemeral-key --version "$version" --tag "v$version" \
            --core-wheel "dist/django_skeleton-$version-py3-none-any.whl" \
            --agent-wheel "dist-agent/skeleton_deployment_agent-$version-py3-none-any.whl" \
            --out "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/stack"
          cp "$RUNNER_TEMP"/release/*.release.skapp "$RUNNER_TEMP/stack/release.skapp"
          jq -r '.ephemeral' "$RUNNER_TEMP/release/trust.json" > "$RUNNER_TEMP/stack/publisher.pub.pem"
          chmod -R a+rX "$RUNNER_TEMP/stack"
          # Só o agente vê o pacote e a chave pública do ensaio.
          printf 'services:\n  agent:\n    volumes:\n      - %s:/rehearsal:ro\n' "$RUNNER_TEMP/stack" > "$RUNNER_TEMP/compose.ci.yaml"
      - name: Certificados, segredos e configuração do cluster
        run: |
          set -eu
          gateway=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "GATEWAY=$gateway" >> "$GITHUB_ENV"
          tls="$RUNNER_TEMP/tls" && mkdir -p "$tls/data" "$tls/node-a" "$tls/node-b"
          # O PostgreSQL do servidor de dados exige TLS (#679).
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 -subj "/CN=host.docker.internal" \
            -keyout "$tls/data/server.key" -out "$tls/data/server.crt"
          chmod 0644 "$tls/data/server.key"
          # A CA privada do canal entre agentes e um certificado por nó (#680).
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 -subj "/CN=ci-cluster-ca" \
            -keyout "$tls/ca.key" -out "$tls/ca.crt"
          secret=$(python -c 'import secrets; print(secrets.token_hex(32))')
          for node in node-a node-b; do
            openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj "/CN=$node" \
              -addext "subjectAltName=DNS:host.docker.internal" -keyout "$tls/$node/node.key" -out "$tls/$node/node.csr"
            openssl x509 -req -in "$tls/$node/node.csr" -CA "$tls/ca.crt" -CAkey "$tls/ca.key" -CAcreateserial -days 2 \
              -copy_extensions copy -out "$tls/$node/node.crt"
            cp "$tls/ca.crt" "$tls/$node/ca.crt" && rm "$tls/$node/node.csr"
            printf '%s\n' "$secret" > "$tls/$node/secret"
            chmod 0600 "$tls/$node/node.key" "$tls/$node/secret"
            sudo chown -R 10001:10001 "$tls/$node"
          done
          # Os anexos num volume que os dois nós montam (#673, E048).
          mkdir -p "$RUNNER_TEMP/files" && sudo chown 10001:10001 "$RUNNER_TEMP/files"
          cat > "$RUNNER_TEMP/data.env" <<EOF
          DATA_BIND_ADDRESS=$gateway
          DATA_CLIENT_CIDR=172.16.0.0/12
          DATA_TLS_DIR=$tls/data
          POSTGRES_PORT=55432
          REDIS_PORT=56379
          PGBOUNCER_PORT=56432
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          SKELETON_OWNER_DB_PASSWORD=$SKELETON_OWNER_DB_PASSWORD
          SKELETON_RUNTIME_DB_PASSWORD=$SKELETON_RUNTIME_DB_PASSWORD
          SKELETON_AGENT_DB_PASSWORD=$SKELETON_AGENT_DB_PASSWORD
          REDIS_PASSWORD=$REDIS_PASSWORD
          EOF
          fernet() { python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'; }
          db="host.docker.internal:55432/skeleton?sslmode=require"
          # A configuração da instância, a mesma nos dois nós (modo cluster, #673).
          cat > "$RUNNER_TEMP/instance.env" <<EOF
          DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_URL=postgres://skeleton_runtime:$SKELETON_RUNTIME_DB_PASSWORD@$db
          CACHE_URL=rediscache://:$REDIS_PASSWORD@host.docker.internal:56379/0
          SKELETON_CACHE_KEY_PREFIX=ci
          EMAIL_URL=smtp://localhost:2525
          DEFAULT_FROM_EMAIL=ci@example.test
          SKELETON_PUBLIC_URL=http://localhost:8000
          SKELETON_FILES_SHARED=true
          MFA_ENCRYPTION_KEYS=$(fernet)
          IDENTITY_PROVIDER_ENCRYPTION_KEYS=$(fernet)
          INTEGRATION_ENCRYPTION_KEYS=$(fernet)
          BILLING_ENCRYPTION_KEYS=$(fernet)
          EOF
          common="SKELETON_INSTANCE_ENV_FILE=$RUNNER_TEMP/instance.env
          SKELETON_RUNTIME_DATABASE_URL=postgres://skeleton_runtime:$SKELETON_RUNTIME_DB_PASSWORD@$db
          SKELETON_FILES_SOURCE=$RUNNER_TEMP/files
          SKELETON_CLUSTER_BIND=$gateway
          SKELETON_AGENT_RELEASE_FILE=/rehearsal/release.skapp
          SKELETON_AGENT_PUBLISHER=ephemeral
          SKELETON_AGENT_PUBLISHER_KEY=/rehearsal/publisher.pub.pem
          SKELETON_AGENT_SOURCE=none
          KEYCLOAK_ADMIN_PASSWORD=unused"
          cat > "$RUNNER_TEMP/node-a.env" <<EOF
          $common
          SKELETON_NODE_ID=node-a
          SKELETON_AGENT_ROLE=candidate
          SKELETON_CLUSTER_PREFERRED=true
          SKELETON_MIGRATION_DATABASE_URL=postgres://skeleton_owner:$SKELETON_OWNER_DB_PASSWORD@$db
          SKELETON_CLUSTER_URL=https://host.docker.internal:9443
          SKELETON_CLUSTER_PORT=9443
          SKELETON_CLUSTER_DIR=$tls/node-a
          SKELETON_WEB_PORT=8000
          EOF
          cat > "$RUNNER_TEMP/node-b.env" <<EOF
          $common
          SKELETON_NODE_ID=node-b
          SKELETON_AGENT_ROLE=follower
          SKELETON_COORDINATION_DATABASE_URL=postgres://skeleton_agent:$SKELETON_AGENT_DB_PASSWORD@$db
          SKELETON_CLUSTER_URL=https://host.docker.internal:9444
          SKELETON_CLUSTER_PORT=9444
          SKELETON_CLUSTER_DIR=$tls/node-b
          SKELETON_WEB_PORT=8001
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP"/*.env
      - name: Servidor de dados
        run: docker compose -p ci-data --env-file "$RUNNER_TEMP/data.env" -f deploy/data-server/compose.yaml --profile pooler up -d --build --wait
      - name: Primeiro nó (candidato), primeira partida pelo agente
        run: |
          node() { docker compose -p "$1" --env-file "$RUNNER_TEMP/$1.env" -f compose.yaml -f "$RUNNER_TEMP/compose.ci.yaml" "${@:2}"; }
          node node-a up -d --build
          healthy() {
            for _ in $(seq 1 240); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$(node "$1" ps -q "$2")")" = healthy ] && return 0
              sleep 5
            done
            node "$1" logs --no-color "$2" | tail -200
            return 1
          }
          healthy node-a agent
          healthy node-a web
          curl -fsS -H 'Host: localhost' http://127.0.0.1:8000/health/ready/
          # The job approves its rehearsal key, but the image must still ship the official one (#720).
          node node-a exec -T agent cat /opt/agent/publishers/skeleton.pub.pem | cmp - deploy/release/publishers/skeleton.pub.pem
      - name: Segundo nó (seguidor) entra pelo canal entre agentes
        run: |
          node() { docker compose -p "$1" --env-file "$RUNNER_TEMP/$1.env" -f compose.yaml -f "$RUNNER_TEMP/compose.ci.yaml" "${@:2}"; }
          node node-b up -d
          for _ in $(seq 1 240); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(node node-b ps -q web)")" = healthy ] && break
            sleep 5
          done
          node node-b logs --no-color agent | tail -100
          curl -fsS -H 'Host: localhost' http://127.0.0.1:8001/health/ready/
      - name: Os dois nós no mesmo release, o primário e as fronteiras da owner
        run: |
          node() { docker compose -p "$1" --env-file "$RUNNER_TEMP/$1.env" -f compose.yaml -f "$RUNNER_TEMP/compose.ci.yaml" "${@:2}"; }
          release() {
            node "$1" exec -T web sh -c 'cd /releases/current && SKELETON_PROJECT_ROOT=$PWD SKELETON_DEPLOYMENT_INVENTORY=$PWD/inventory.json PYTHONPATH=$PWD exec .venv/bin/python "$@"' sh "${@:2}"
          }
          a=$(curl -fsS -H 'Host: localhost' http://127.0.0.1:8000/health/release/)
          b=$(curl -fsS -H 'Host: localhost' http://127.0.0.1:8001/health/release/)
          echo "$a" && echo "$b"
          [ "$(echo "$a" | jq -c '{generation, core}')" = "$(echo "$b" | jq -c '{generation, core}')" ]
          [ "$(echo "$a" | jq -r .node_id)" = node-a ] && [ "$(echo "$b" | jq -r .node_id)" = node-b ]
          status=$(node node-a exec -T agent python -m deployment_agent --config /agent/private/agent.json cluster status)
          echo "$status"
          [ "$(echo "$status" | jq -r .primary.node_id)" = node-a ]
          [ "$(echo "$status" | jq '[.nodes[] | select(.alive)] | length')" = 2 ]
          # Sem E037, E048 ou E049; os erros de deploy falham o passo.
          release node-a manage.py check --deploy --fail-level ERROR
          release node-b manage.py check --deploy --fail-level ERROR
          # Um anexo gravado por um nó aparece no outro (o volume compartilhado declarado).
          node node-a exec -T web sh -c 'echo shared > /files/ci-probe'
          [ "$(node node-b exec -T web cat /files/ci-probe)" = shared ]
          # A credencial owner não chega aos serviços de aplicação, nem ao agente seguidor.
          for project in node-a node-b; do
            for service in web worker scheduler; do
              if node "$project" exec -T "$service" sh -c 'cat /proc/[0-9]*/environ 2>/dev/null | tr "\0" "\n"' | grep -E 'skeleton_owner|MIGRATION_DATABASE_URL=.'; then
                echo "owner no ambiente de $project/$service" >&2
                exit 1
              fi
            done
          done
          if node node-b exec -T agent sh -c 'cat /proc/[0-9]*/environ 2>/dev/null | tr "\0" "\n"; cat /agent/private/migration.env' | grep -E 'skeleton_owner|MIGRATION_DATABASE_URL=.'; then
            echo "owner no agente seguidor" >&2
            exit 1
          fi
          # Nenhum container monta o socket Docker.
          if docker inspect $(docker ps -q) --format '{{range .Mounts}}{{.Source}} {{end}}' | grep -q docker.sock; then
            echo "socket Docker montado" >&2
            exit 1
          fi
      - name: Uma instância por cluster, TLS obrigatório, rede dos nós e o PgBouncer (#679)
        run: |
          set -eu
          node() { docker compose -p "$1" --env-file "$RUNNER_TEMP/$1.env" -f compose.yaml -f "$RUNNER_TEMP/compose.ci.yaml" "${@:2}"; }
          # Uma segunda instância no mesmo servidor de dados: as próprias senhas e uma rede de nós
          # (192.0.2.0/24) que não é a deste runner.
          cat > "$RUNNER_TEMP/data-b.env" <<EOF
          DATA_BIND_ADDRESS=$GATEWAY
          DATA_CLIENT_CIDR=192.0.2.0/24
          DATA_TLS_DIR=$RUNNER_TEMP/tls/data
          POSTGRES_PORT=55433
          REDIS_PORT=56380
          POSTGRES_PASSWORD=cipostgresb
          SKELETON_OWNER_DB_PASSWORD=ciownerb
          SKELETON_RUNTIME_DB_PASSWORD=ciruntimeb
          REDIS_PASSWORD=ciredisb
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/data-b.env"
          docker compose -p ci-data-b --env-file "$RUNNER_TEMP/data-b.env" -f deploy/data-server/compose.yaml up -d --build --wait
          python - <<'EOF'
          import os

          import psycopg

          host = os.environ["GATEWAY"]


          def connect(port, password, sslmode="require"):
              return psycopg.connect(
                  host=host, port=port, dbname="skeleton", user="skeleton_runtime",
                  password=password, sslmode=sslmode, connect_timeout=10,
              )


          def refused(port, password, fragment, sslmode="require"):
              try:
                  connect(port, password, sslmode).close()
              except psycopg.OperationalError as error:
                  assert fragment in str(error), str(error)
                  print(f"recusado como esperado ({port}, sslmode={sslmode}): {fragment or 'sem TLS'}")
                  return
              raise SystemExit(f"a conexão devia ser recusada: porta {port}, sslmode={sslmode}")


          connect(55432, "ciruntime").close()
          # A senha da runtime da outra instância não abre esta: um cluster e uma senha por instância.
          refused(55432, "ciruntimeb", "password authentication failed")
          # Sem TLS, o pg_hba não tem entrada.
          refused(55432, "ciruntime", "no pg_hba.conf entry", sslmode="disable")
          # Fora de DATA_CLIENT_CIDR, nem a senha certa entra.
          refused(55433, "ciruntimeb", "no pg_hba.conf entry")
          # O PgBouncer aplica a mesma regra: TLS, SCRAM e a rede dos nós; o search_path vem da role.
          with connect(56432, "ciruntime") as connection:
              assert connection.execute("SHOW search_path").fetchone()[0].startswith("skeleton")
          refused(56432, "ciruntime", "", sslmode="disable")
          refused(56432, "ciruntimeb", "")
          EOF
          # Um nó de app pelo PgBouncer em modo transação (#676): checks de deploy (E050, search_path
          # da role) e a conferência do schema com a role runtime.
          pooled="postgres://skeleton_runtime:$SKELETON_RUNTIME_DB_PASSWORD@host.docker.internal:56432/skeleton?sslmode=require"
          for command in "check --deploy --fail-level ERROR" "check_skeleton_schema"; do
            node node-a exec -T -e DATABASE_URL="$pooled" -e DATABASE_TRANSACTION_POOLER=true -e DATABASE_CONN_MAX_AGE=0 web \
              sh -c 'cd /releases/current && SKELETON_PROJECT_ROOT=$PWD SKELETON_DEPLOYMENT_INVENTORY=$PWD/inventory.json PYTHONPATH=$PWD exec .venv/bin/python manage.py "$@"' sh $command
          done
      - name: Logs da stack
        if: failure()
        run: |
          node() { docker compose -p "$1" --env-file "$RUNNER_TEMP/$1.env" -f compose.yaml -f "$RUNNER_TEMP/compose.ci.yaml" "${@:2}"; }
          docker compose -p ci-data --env-file "$RUNNER_TEMP/data.env" -f deploy/data-server/compose.yaml --profile pooler logs --no-color | tail -100
          docker compose -p ci-data-b --env-file "$RUNNER_TEMP/data-b.env" -f deploy/data-server/compose.yaml logs --no-color | tail -40 || true
          for project in node-a node-b; do
            node "$project" logs --no-color | tail -300
            # A saída de cada comando do agente fica no armazenamento privado dele (senhas só de ensaio).
            node "$project" cp agent:/agent/state/logs "$RUNNER_TEMP/agent-logs-$project" || true
            find "$RUNNER_TEMP/agent-logs-$project" -name '*.log' -exec sh -c 'echo "== $1"; tail -n 60 "$1"' sh {} \; || true
          done

  ci:
    name: CI
    # Um nome estável para exigir na proteção de branch, qualquer que seja a matriz acima.
    if: always()
    needs: [lint, assets, locks, tests, coverage, typecheck, deploy-check, build, compose-stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Todos os jobs passaram
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
