name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Bibliotecas nativas exigidas pelos wheels SAML travados (mesmas do Dockerfile).
  SYSTEM_PACKAGES: libxml2 libxmlsec1 libxmlsec1-openssl xmlsec1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The local hooks again, for commits made without pre-commit installed (#329). The Ruff
      # hooks are skipped (the steps below run them) and commit-msg is not a pre-commit stage.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Hooks do pre-commit (exceto o commit-msg)
        run: uvx pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.4"
          args: check --output-format github
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.4"
          args: format --check --diff

  assets:
    name: CSS compilado e assets vendorizados
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar lock do frontend (sem scripts de instalação)
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Conferir que static/ corresponde às fontes (Tailwind, Flowbite, Inter)
        # Falha se site.css/admin.css ou os arquivos de vendor/ estiverem desatualizados.
        working-directory: frontend
        run: npm run check

  locks:
    name: Locks correspondem aos requirements .in
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Versão fixa: o formato e o cabeçalho do lock dependem do uv.
          version: "0.12.7"
          enable-cache: false
      - name: Regenerar os locks e exigir diff vazio
        # Com -o, o uv usa o lock existente como preferência: só há diff quando
        # um .in mudou sem regenerar ou o lock foi gerado por outra ferramenta.
        run: |
          uv pip compile --python-version 3.14 --python-platform x86_64-manylinux_2_28 --generate-hashes requirements.in -o requirements.txt
          uv pip compile --python-version 3.14 --python-platform x86_64-manylinux_2_28 --generate-hashes requirements-dev.in -o requirements-dev.txt
          if ! git diff --exit-code -- requirements.txt requirements-dev.txt; then
            echo "::error::requirements.txt/requirements-dev.txt não correspondem aos .in. Regenere com os comandos de 'Atualizar locks' do README.md (uv 0.12.7) e commite o diff."
            exit 1
          fi

  tests:
    name: Testes em PostgreSQL (Python ${{ matrix.python }}, ${{ matrix.suite }}, role runtime)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        # A suíte do núcleo é dividida em fatias de arquivos (tools/suite_shards.py): juntas, as
        # fatias são a suíte inteira. Para mudar o número de fatias, troque N aqui em todas elas.
        suite: ["núcleo 1/2", "núcleo 2/2", "agenda"]
        include:
          - suite: "núcleo 1/2"
            shard: "1/2"
            slug: core-1
          - suite: "núcleo 2/2"
            shard: "2/2"
            slug: core-2
          - suite: "agenda"
            slug: calendar
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: ci-superuser-only
          # Container descartável: não espera o disco, e a tabela de locks comporta um worker
          # por vCPU recriando o schema ao mesmo tempo (cerca de 2.100 locks por restauração).
          POSTGRES_INITDB_ARGS: >-
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
            -c max_locks_per_transaction=2048
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SKELETON_ENABLE_EXAMPLE_APP: "true"
      # Tests marked needs_example_app fail instead of skipping without the example app (#264).
      SKELETON_TEST_REQUIRE_EXAMPLE_APP: "1"
      # The core suite runs without first-party apps (#66); each one adds its own suite.
      SKELETON_BUNDLED_APPS: ${{ matrix.slug == 'calendar' && 'calendar' || '' }}
      SKELETON_TEST_ALLOW_SCHEMA_RESET: "1"
      # Sem o cache local do template (#350): cada execução do CI aplica as migrations de verdade.
      SKELETON_TEST_TEMPLATE_CACHE: "0"
      # As assertions usam skeleton_runtime (NOSUPERUSER, NOBYPASSRLS); o owner só migra.
      # Com pytest -n, cada worker deriva o seu banco: ci_gw0_skeleton_test, ci_gw1_...
      TEST_DATABASE_URL: postgres://skeleton_runtime:ci-runtime@127.0.0.1:5432/ci_skeleton_test
      TEST_MIGRATION_DATABASE_URL: postgres://skeleton_owner:ci-owner@127.0.0.1:5432/ci_skeleton_test
      # Um worker por vCPU do runner; o passo de provisionamento cria um banco para cada um.
      TEST_WORKERS: "4"
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-superuser-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências do sistema
        # redis-server alimenta o teste do healthcheck renderizado pelo Compose; o cliente
        # PostgreSQL provisiona o banco e gera o template de schema (pg_dump).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES redis-server postgresql-client
      - name: Provisionar bancos descartáveis e roles
        run: |
          for database in ci_skeleton_test $(seq -f 'ci_gw%g_skeleton_test' 0 $((TEST_WORKERS - 1))); do
            createdb "$database"
            psql -q -v ON_ERROR_STOP=1 -d "$database" -f deploy/postgres/bootstrap.sql
            # O GRANT permite que reset_schema() recrie o schema skeleton como owner.
            psql -q -v ON_ERROR_STOP=1 -d "$database" -c "GRANT CREATE ON DATABASE $database TO skeleton_owner"
          done
          psql -v ON_ERROR_STOP=1 -d ci_skeleton_test \
            -c "ALTER ROLE skeleton_owner PASSWORD 'ci-owner'" \
            -c "ALTER ROLE skeleton_runtime PASSWORD 'ci-runtime'" \
            -c "SELECT name, setting FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes', 'max_locks_per_transaction')"
      - name: Instalar lock com hashes
        # Os testes de Compose invocam .venv/bin/python, então o venv fica na raiz.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Django checks
        # Uma vez por Python e por conjunto de apps: na primeira fatia do núcleo e na agenda.
        if: matrix.slug != 'core-2'
        run: |
          .venv/bin/python manage.py check --fail-level WARNING
          .venv/bin/python manage.py makemigrations --check --dry-run
      - name: Fatia ${{ matrix.shard }} da suíte com cobertura
        if: matrix.shard
        env:
          COVERAGE_FILE: coverage-data/coverage.py${{ matrix.python }}.${{ matrix.slug }}
        run: |
          mkdir -p coverage-data
          # A slice covers only part of the code: the floor (fail_under) applies to the combined
          # report of the "coverage" job, never to a slice (#329).
          .venv/bin/python -m pytest tests -q -n "$TEST_WORKERS" --shard "${{ matrix.shard }}" --cov --cov-report= --cov-fail-under=0
      - name: Agenda (app first-party, SKELETON_BUNDLED_APPS=calendar)
        # Its own suite and checks with the app installed; the core slices run without it.
        if: matrix.slug == 'calendar'
        run: .venv/bin/python -m pytest tests/contrib/calendar -q -n "$TEST_WORKERS"
      - name: Smoke de segurança do runtime
        if: matrix.python == '3.14' && matrix.slug == 'core-1'
        run: .venv/bin/python tools/smoke_postgres.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.shard
        with:
          name: coverage-data-py${{ matrix.python }}-${{ matrix.slug }}
          path: coverage-data/
          if-no-files-found: error

  coverage:
    name: Cobertura da suíte (Python ${{ matrix.python }})
    needs: tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-data-py${{ matrix.python }}-*
          path: coverage-data
          merge-multiple: true
      - name: Combinar a cobertura das fatias
        # Mesma medição de antes da divisão: a suíte do núcleo inteira, por Python.
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          # Arquivos nomeados: num diretório, o coverage só procura nomes ".coverage*", e o
          # upload-artifact deixa arquivos ocultos de fora.
          python -m coverage combine coverage-data/coverage.*
          python -m coverage report
          python -m coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-postgres-py${{ matrix.python }}
          path: coverage.xml

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: mypy (módulos listados em pyproject.toml)
        # The calendar is checked strictly (#348): the Django plugin must load its models.
        env:
          SKELETON_BUNDLED_APPS: calendar
        run: python -m mypy
      - name: Catálogo de tradução válido (makemessages e msgfmt --check-format)
        run: |
          sudo apt-get install -y --no-install-recommends gettext
          python tools/i18n_check.py

  deploy-check:
    name: Settings de produção (check --deploy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: manage.py check --deploy
        # Valores descartáveis: o check não conecta ao banco, cache ou SMTP.
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export MFA_ENCRYPTION_KEYS="$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: ci.example.test
          DATABASE_URL: postgres://skeleton_runtime:unused@127.0.0.1:1/unused
          CACHE_URL: rediscache://127.0.0.1:1/0
          EMAIL_URL: smtp://127.0.0.1:1
          DEFAULT_FROM_EMAIL: ci@example.test
          SKELETON_PUBLIC_URL: https://ci.example.test

  build:
    name: Wheel, auditoria e imagem
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - name: Construir wheel do núcleo
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Construir e instalar o wheel do agente
        # A distribuição separada do operador (#309): construída, instalada num venv limpo só com
        # o lock e executável. Os pins de execução dela coincidem com o lock auditado abaixo.
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist-agent ./deployment_agent
          python -m venv /tmp/agent-venv
          /tmp/agent-venv/bin/python -m pip install --require-hashes -r requirements.txt
          /tmp/agent-venv/bin/python -m pip install --no-deps dist/*.whl dist-agent/*.whl
          /tmp/agent-venv/bin/python -m pip check
          /tmp/agent-venv/bin/skeleton-deployment-agent --help
      - name: Auditar dependências travadas
        # pip-audit isolado: nada é instalado no ambiente em que o lock foi instalado.
        run: |
          python -m pip install --target /tmp/pip-audit "pip-audit==2.9.0"
          PYTHONPATH=/tmp/pip-audit python -m pip_audit --strict --require-hashes --disable-pip -r requirements.txt
          PYTHONPATH=/tmp/pip-audit python -m pip_audit --strict --require-hashes --disable-pip -r requirements-dev.txt
      - name: Construir imagem
        run: docker build --tag django-skeleton:ci .
      - name: Contexto de build não vira camada
        run: |
          docker build --target project-assets --tag django-skeleton:assets .
          docker run --rm django-skeleton:assets sh -c '! test -e /project-source'
      - name: Validar o compose do sandbox (#369)
        env:
          SANDBOX_HOST: sandbox.example.test
          POSTGRES_PASSWORD: ci
          SKELETON_OWNER_DB_PASSWORD: ci
          SKELETON_RUNTIME_DB_PASSWORD: ci
          REDIS_PASSWORD: ci
        run: |
          config=$(docker compose -f compose.sandbox.yaml config --format json)
          # Nenhuma porta no host: o proxy do Coolify chega ao web pela rede interna.
          echo "$config" | jq -e '[.services[] | select(.ports)] == []'
          # A URL owner só no migrate; a senha owner só no migrate e no init do PostgreSQL.
          echo "$config" | jq -e '[.services | to_entries[] | select(.value.environment.MIGRATION_DATABASE_URL) | .key] == ["migrate"]'
          echo "$config" | jq -e '[.services | to_entries[] | select(.value.environment.SKELETON_OWNER_DB_PASSWORD) | .key] == ["postgres"]'
          # Sem uma variável obrigatória, o compose recusa em vez de subir com valor vazio.
          if env -u REDIS_PASSWORD docker compose -f compose.sandbox.yaml config --quiet 2>/dev/null; then
            echo "compose.sandbox.yaml aceitou REDIS_PASSWORD ausente" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-wheel
          path: dist/*.whl

  ci:
    name: CI
    # Um nome estável para exigir na proteção de branch, qualquer que seja a matriz acima.
    if: always()
    needs: [lint, assets, locks, tests, coverage, typecheck, deploy-check, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Todos os jobs passaram
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  deploy-sandbox:
    name: Deploy do sandbox (Coolify)
    # Só depois do CI verde num push para main (o merge de um PR); nunca em pull request (#369).
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: sandbox
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: false
    steps:
      - name: Disparar o deploy no Coolify
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Projetos derivados sem sandbox não configuram os secrets: o job não falha por isso.
          if [ -z "$COOLIFY_DEPLOY_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::Secrets COOLIFY_DEPLOY_URL/COOLIFY_TOKEN ausentes no environment sandbox; deploy não disparado."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_DEPLOY_URL"
