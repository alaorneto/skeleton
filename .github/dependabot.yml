version: 2
updates:
  # Os locks são gerados por `uv pip compile` (README, "Atualizar locks"), que o
  # Dependabot não reproduz: ele muda só os .in ou regenera no estilo pip-compile,
  # sem pip/setuptools. O job "locks" do CI reprova esses PRs, e o workflow
  # dependabot-locks os regenera no branch do PR (docs/testing.md, "Locks dos PRs
  # do Dependabot"). O grupo junta os bumps de versão num PR por semana. Alertas e
  # atualizações de segurança são configuração do repositório (Settings → Advanced
  # Security), não deste arquivo: veja SECURITY.md.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # A versão minor do Python é decisão de suporte (matriz do CI, os três FROM,
    # tests/unit/test_workflow_pins.py, wheels de lxml/xmlsec), não bump automático:
    # só os patches da 3.14 chegam por aqui (#432, PR #385).
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: docker
    directory: /deploy/agent
    schedule:
      interval: weekly
    # A versão minor do Python é decisão de suporte (matriz do CI, os três FROM,
    # tests/unit/test_workflow_pins.py, wheels de lxml/xmlsec), não bump automático:
    # só os patches da 3.14 chegam por aqui (#432, PR #385).
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Também monitorados (#309): o CSS/JS do frontend (o flowbite.min.js vai no wheel), as imagens
  # do Compose e a distribuição do agente.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /deployment_agent
    schedule:
      interval: weekly
