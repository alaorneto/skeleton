{% load i18n %}{% if notes %}<ul class="space-y-2 text-sm/6">{% for note in notes %}<li><a href="{% url 'web:record' organization_id 'example_notes.note' note.sysid %}">{{ note.title }}</a> <code class="text-xs text-body-subtle">{{ note.code }}</code></li>{% endfor %}</ul>{% else %}<p class="text-sm/6 text-body-subtle">{% translate "Nenhuma anotação ainda." %}</p>{% endif %}
<p class="mt-4"><a class="btn btn-secondary btn-sm" href="{% url 'web:records' organization_id 'example_notes.note' %}">{% translate "Ver todas as anotações" %}{% include "skeleton/web/components/icon.html" with name="arrow-right" %}</a></p>
