[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skeleton-deployment-agent"
version = "0.5.0"
description = "Independent operator-owned signed-release control plane"
requires-python = ">=3.12,<3.15"
dependencies = ["django-skeleton==0.5.0", "packaging==26.3", "cryptography==50.0.2"]

[project.scripts]
skeleton-deployment-agent = "deployment_agent.__main__:main"

[tool.setuptools]
packages = ["deployment_agent"]
package-dir = {deployment_agent = "."}
